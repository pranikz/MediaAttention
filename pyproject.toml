[project]
name = "mediaattention"
version = "0.1.0"
description = "Open-source predicted attention heatmaps and creative scoring for ads and media"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow"]

[project.optional-dependencies]
deepgaze = ["torch", "torchvision", "clip @ git+https://github.com/openai/CLIP", "einops", "deepgaze_pytorch @ git+https://github.com/matthias-k/DeepGaze"]
aoi = ["torch", "transformers", "rapidocr_onnxruntime"]
video = ["av", "opencv-python-headless"]
ui = ["gradio"]
memory = ["resmem"]  # NON-COMMERCIAL license, see README
dev = ["pytest"]

[project.scripts]
mediaattention = "mediaattention.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
