[project]
name = "mediaattention"
version = "0.2.0"
description = "Open-source attention prediction and creative scoring for image and video ads"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "mediaattention/unisal/LICENSE"]
authors = [{ name = "Pratyush Mahapatra" }]
requires-python = ">=3.10"
keywords = ["saliency", "eye-tracking", "visual-attention", "advertising", "marketing", "computer-vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy", "scipy", "pillow"]

[project.optional-dependencies]
unisal = ["torch", "huggingface_hub"]  # default attention model
aoi = ["torch", "transformers", "rapidocr_onnxruntime"]
video = ["av", "opencv-python-headless"]
ui = ["gradio"]
memory = ["resmem"]  # NON-COMMERCIAL license, see README
all = ["mediaattention[unisal,aoi,video,ui]"]
dev = ["pytest"]
# DeepGaze (optional model) isn't on PyPI; install it from source, see README

[project.urls]
Homepage = "https://pranikz.github.io/MediaAttention/"
Repository = "https://github.com/pranikz/MediaAttention"
Model = "https://huggingface.co/pranikz/MediaAttention"
Report = "https://github.com/pranikz/MediaAttention/blob/main/docs/research/MediaAttention-report.pdf"
Changelog = "https://github.com/pranikz/MediaAttention/blob/main/CHANGELOG.md"

[project.scripts]
mediaattention = "mediaattention.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/mediaattention", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff", "/pyproject.toml"]
